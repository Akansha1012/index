<style>
/* Layout: plot picker rail on the left, pricing console + live A4 preview on the right; stacks on phones. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#14211D; --muted:#5D6B66; --line:#DCE2DE;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#E2EFEA; --sun:#C98A12; --sun-soft:#FBF1DC;
  --warn:#B4441F; --warn-soft:#FBE7DF; --ok:#1E7A4C;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* printed-paper tokens: the cost sheet always prints light */
  --p-bg:#FFFFFF; --p-ink:#16201D; --p-muted:#5F6B67; --p-line:#D9DFDB; --p-band:#17624F; --p-band-ink:#FFFFFF; --p-tint:#EEF4F1; --p-gold:#9A6A0C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --ink:#E6ECE9; --muted:#97A59F; --line:#2A3632;
  --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1B312A; --sun:#E7B04A; --sun-soft:#33291A;
  --warn:#EE8A68; --warn-soft:#3A2119; --ok:#5CC48E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --ink:#E6ECE9; --muted:#97A59F; --line:#2A3632;
  --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1B312A; --sun:#E7B04A; --sun-soft:#33291A;
  --warn:#EE8A68; --warn-soft:#3A2119; --ok:#5CC48E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:16px}
.top h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.top h1 span{color:var(--accent)}
.top p{margin:0;color:var(--muted);font-size:13px}

.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* picker */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px)}
@media (max-width:900px){.picker{position:static;max-height:none}}
.pk-head{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pk-count{font-size:12px;color:var(--muted)}
.list{overflow:auto;padding:6px;display:grid;gap:2px;align-content:start}
@media (max-width:900px){.list{max-height:320px}}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item b{font-family:var(--mono);font-weight:500;font-size:14px}
.item .meta{grid-column:1/2;font-size:12px;color:var(--muted)}
.item .px{font-family:var(--mono);font-size:13px;text-align:right}
.item .tags{grid-column:2/3;display:flex;gap:4px;justify-content:flex-end}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.offer{background:var(--sun-soft);color:var(--sun)}
.item.blk{opacity:.55}
.item.blk .px{text-decoration:line-through}
.tag.blk{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tag.prop{background:var(--warn-soft);color:var(--warn)}

/* console */
.work{display:grid;gap:18px;min-width:0}
.console{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;min-width:0}
.plothead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.plothead h2{font-family:var(--display);font-size:30px;margin:0;font-weight:700;letter-spacing:-.01em}
.plothead .facts{color:var(--muted);font-size:13px}
.allin{display:grid;gap:8px}
.allin-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.field{display:flex;align-items:center;border:2px solid var(--accent);border-radius:10px;background:var(--bg);padding:0 12px;min-width:0;flex:1 1 300px;max-width:420px}
.field span{font-family:var(--display);font-size:26px;color:var(--accent)}
.field input{border:0;background:transparent;font-family:var(--mono);font-size:26px;padding:8px 6px;width:100%;min-width:0;outline:none}
.words{font-family:var(--display);font-size:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.qb:hover{border-color:var(--accent);color:var(--accent)}
.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:640px){.readout{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ro{padding:10px 12px;border-right:1px solid var(--line);display:grid;gap:2px;min-width:0}
.ro:last-child{border-right:0}
@media (max-width:640px){.ro:nth-child(2){border-right:0}.ro:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.ro .v{font-family:var(--mono);font-size:16px;font-weight:500}
.ro .s{font-size:11.5px;color:var(--muted)}
.ro.hl .v{color:var(--sun)}
.floors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sun-soft)}
.floors div{padding:10px 12px;border-right:1px solid var(--line);display:grid;gap:2px;min-width:0}
.floors div:last-child{border-right:0}
.floors b{font-family:var(--mono);font-size:16px;font-weight:500}
.floors span{font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.floors{grid-template-columns:minmax(0,1fr)}.floors div{border-right:0;border-bottom:1px solid var(--line)}}
.status{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-start;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--accent-soft)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.note{background:var(--sun-soft)}
.status i{font-style:normal;font-weight:700}
details.names summary{cursor:pointer;font-size:13px;color:var(--muted)}
.names-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.names-grid label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.names-grid input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toast{font-size:13px;color:var(--muted)}

/* preview */
.preview-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.preview{display:grid;gap:14px;justify-items:center;min-width:0}
.pscale{width:100%;overflow:hidden}
.pscale .inner{transform-origin:top left;width:794px}
.page{width:794px;height:1123px;background:#fff;padding:34px 30px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
table.xs{border-collapse:collapse;table-layout:fixed;width:734px;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:10.5px;color:#000;line-height:1.15}
.xs td{border:1px solid #000;height:17px;padding:1px 4px;vertical-align:middle;white-space:nowrap;overflow:hidden}
.xs .c{text-align:center}.xs .r{text-align:right}.xs .b{font-weight:700}
.xs .dk{background:#404040;color:#fff;font-weight:700;text-align:center}
.xs .gy{background:#F2F2F2}
.xs .pc{background:#FBE3D6;font-weight:700;text-align:center}
.xs .pk{background:#F6C6AD;font-weight:700}
.xs .red{color:#FF0000}
.xs .tall{height:28px}
.xs .og{font-size:34px;font-weight:700;text-align:center}
.xs .ar{font-family:Arial,Helvetica,sans-serif;font-size:9.5px}
.xs td.nb{border-top:0;border-bottom:0}
.xs td.nbr{border-right:0}.xs td.nbl{border-left:0}
.xs td.wrap{white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Goa <span>Cost Sheets</span> · Admin</h1>

  <div class="grid">

      <div class="list" id="list" role="listbox" aria-label="Available units"></div>

    <section class="work">

          <div class="allin-row">

            <div class="words" id="words"></div>

          <div class="hint">Type the full amount or shorthand like <b>1.05cr</b> or <b>98L</b>, then press Enter. Offers are worked out for you.</div>
          <div class="quick" id="quick"></div>
        </div>
        <div class="floors" id="floors"></div>
        <div class="readout">
          <div class="ro"><span class="lbl">List All-In</span><span class="v" id="rList"></span><span class="s" id="rListS"></span></div>
          <div class="ro hl"><span class="lbl">Offer applied</span><span class="v" id="rOffer"></span><span class="s" id="rOfferS"></span></div>
          <div class="ro"><span class="lbl">All-In / sq ft</span><span class="v" id="rPsf"></span><span class="s" id="rPsfS"></span></div>
          <div class="ro"><span class="lbl">Agreement value</span><span class="v" id="rAv"></span><span class="s" id="rAvS"></span></div>
        </div>
        <div class="status" id="status"></div>
        <div class="share">
          <button class="btn" id="dlPng">Download price sheet</button>
          <span class="toast" id="toast" role="status"></span>
        </div>
      </div>
      <div class="preview-head"><span class="lbl">Price sheet · this is what downloads</span></div>
      <div class="pscale" id="pscale"><div class="inner" id="pages"></div></div>
    </section>
  </div>
</div>

  p.listAllIn = costSheet(p, listAV(p)).allIn; p.curAllIn = costSheet(p, currentAV(p)).allIn;
  const disc = roundTo(p.listAllIn * discRatio(p));
  p.defAllIn = disc;                                                  // starting price shown to TLs
  const af = CONFIG.actualFloor[p.project + "-" + p.kind];
  p.actualFloor = af.skus[p.area] ?? Math.ceil((af.psf ? p.area * af.psf : disc * af.ratio) / 10000) * 10000;  // real bottom All-In
  p.minAllIn = Math.max(roundTo(disc * (1 - CONFIG.extraDiscount)), p.actualFloor);                         // TL floor
});
// smallest agreement value whose All-In is at least `min`
function atLeast(p, min) { let lo = 0, hi = Math.floor(listAV(p)); while (lo < hi) { const m = Math.floor((lo + hi) / 2); if (costSheet(p, m).allIn >= min) hi = m; else lo = m + 1; } return costSheet(p, lo); }

const S = { project: "OG", phase: "All", band: "All", q: "", sort: "plot", sel: null, target: null };

$("asof").textContent = `Inventory as of ${CONFIG.inventoryAsOf} · ${CONFIG.priceQuarter} pricing · ${plots.filter(p => !p.blocked).length} units available`;
$("projChips").innerHTML = Object.entries(CONFIG.projects).map(([k, v]) => `<button class="chip" data-pj="${k}" aria-pressed="${k === S.project}">${v.name}</button>`).join("");
$("projChips").onclick = e => { const b = e.target.closest("[data-pj]"); if (!b) return; S.project = b.dataset.pj; S.phase = "All"; S.band = "All";
  [...$("projChips").children].forEach(c => c.setAttribute("aria-pressed", c === b)); filters(); renderList(); };
$("phaseChips").onclick = e => { const b = e.target.closest("[data-ph]"); if (!b) return; S.phase = b.dataset.ph; [...$("phaseChips").children].forEach(c => c.setAttribute("aria-pressed", c === b)); renderList(); };
function filters() {
  const mine = plots.filter(p => p.project === S.project);
  const phases = [...new Set(mine.map(p => p.phase).filter(Boolean))].sort();
  $("phaseBox").hidden = phases.length < 2;
  $("phaseChips").innerHTML = ["All", ...phases].map(p => `<button class="chip" data-ph="${p}" aria-pressed="${p === S.phase}">${p}</button>`).join("");
  const bands = [...new Set(mine.map(p => p.band))].sort((a, b) => parseInt(a.replace(/\D+/, "")) - parseInt(b.replace(/\D+/, "")));
  $("band").innerHTML = `<option value="All">All sizes</option>` + bands.map(b => `<option>${b}</option>`).join("");
}
filters();
$("band").onchange = e => { S.band = e.target.value; renderList(); };
$("sort").onchange = e => { S.sort = e.target.value; renderList(); };
$("q").oninput = e => { S.q = e.target.value.trim().toUpperCase().replace(/\s/g, ""); renderList(); };

function renderList() {
  let L = plots.filter(p => p.project === S.project && (S.phase === "All" || p.phase === S.phase) && (S.band === "All" || p.band === S.band)
    && (!S.q || p.plot.replace("-", "").includes(S.q.replace("-", ""))));
  L.sort(S.sort === "price" ? (a, b) => a.defAllIn - b.defAllIn : S.sort === "area" ? (a, b) => a.area - b.area : (a, b) => a.plot.localeCompare(b.plot, undefined, { numeric: true }));
  L.sort((a, b) => a.blocked - b.blocked);
  $("count").textContent = `${L.filter(p => !p.blocked).length} available · ${L.filter(p => p.blocked).length} blocked`;
  $("list").innerHTML = L.map(p => `<button class="item${p.blocked ? " blk" : ""}" role="option" data-id="${p.id}" aria-selected="${S.sel && S.sel.id === p.id}">
      <b>${p.plot}</b>${p.blocked ? '<span class="tags"><span class="tag blk">Blocked</span></span>' : `<span class="px">${cr(p.defAllIn)}</span>`}
      <span class="meta">${p.area.toLocaleString("en-IN")} sq ft${p.phase ? " · Phase " + p.phase : ""}</span>
    </button>`).join("") || `<p class="hint" style="padding:12px">No plots match. Clear a filter to see more.</p>`;
}
$("list").onclick = e => { const b = e.target.closest("[data-id]"); if (b) pick(b.dataset.id); };

function pick(id) {
  S.sel = plots.find(p => p.id === id); const p = S.sel; S.target = p.defAllIn;
  [...$("list").querySelectorAll(".item")].forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  $("pTitle").textContent = "Plot " + p.plot;
  $("pFacts").textContent = [CONFIG.projects[p.project].name, `${p.area.toLocaleString("en-IN")} sq ft`, p.phase && `Phase ${p.phase}`].filter(Boolean).join(" · ");
  $("floors").innerHTML = `<div><span class="lbl">Discounted price</span><b>${inr(p.defAllIn)}</b><span>TLs start here</span></div>
    <div><span class="lbl">TL floor</span><b>${inr(p.minAllIn)}</b><span>3% below discounted, never below actual</span></div>
    <div><span class="lbl">Actual floor</span><b>${inr(p.actualFloor)}</b><span>lowest you can close at</span></div>`;
  if (p.blocked) {

    if ($("floors")) $("floors").innerHTML = "";

    $("pages").innerHTML = `<div class="page" style="display:grid;place-items:center;color:#5F6B67;font-family:var(--body);font-size:15px;text-align:center">Plot ${esc(p.plot)} is blocked.<br>Choose an available unit.</div>`;

$("quick").onclick = e => { const b = e.target.closest("[data-v]"); if (b) { S.target = +b.dataset.v; update(); } };
function parseAmt(s) {
  s = s.toLowerCase().replace(/[,₹\s]/g, "");
  const m = s.match(/^(\d*\.?\d+)(cr|crore|crores|l|lac|lacs|lakh|lakhs|k)?$/); if (!m) return null;
  const n = parseFloat(m[1]), u = m[2] || "";
  return r0(n * (u.startsWith("c") ? 1e7 : u.startsWith("l") ? 1e5 : u === "k" ? 1e3 : 1));
}
$("allin").addEventListener("change", e => { const v = parseAmt(e.target.value); if (R && v === r0(R.allIn)) return; if (v) { S.target = v; } update(); });
$("allin").addEventListener("keydown", e => { if (e.key === "Enter") e.target.dispatchEvent(new Event("change")); });

let R = null;
function update() {
  const p = S.sel; if (!p || p.blocked) return;
  const st = $("status"), target = S.target;
  if (target < 1 || !solve(p, target)) { // admin version: no TL floor, only impossible amounts are refused
    R = null;
    $("allin").value = inrN(target); $("words").textContent = cr(target);
    for (const id of ["rOffer", "rPsf", "rAv"]) $(id).textContent = "—";
    for (const id of ["rOfferS", "rPsfS", "rAvS"]) $(id).textContent = "";
    $("rList").textContent = inr(p.listAllIn);
    st.className = "status warn";
    st.innerHTML = `<i>!</i><span>${inr(target)} is too low to build a cost sheet for Plot ${p.plot}.</span>`;
    $("pages").innerHTML = `<div class="page" style="display:grid;place-items:center;color:#5F6B67;font-family:var(--body);font-size:15px;text-align:center">Price sheet unavailable at this price.<br>Enter a valid All-In to see the sheet.</div>`;
    fit(); $("dlPng").disabled = true; return;
  }
  $("dlPng").disabled = false;
  const sol = solve(p, target);
  R = sol.c; R.p = p; R.target = S.target;
  $("allin").value = inrN(R.allIn); $("words").textContent = cr(R.allIn);
  const off = R.offers, pct = off / p.listAllIn;
  $("rList").textContent = inr(p.listAllIn); $("rListS").textContent = "";
  $("rOffer").textContent = inr(off);
  $("rOfferS").textContent = off > 0 ? `${(pct * 100).toFixed(1)}% of list`  : "no offer";
  $("rPsf").textContent = inr(R.allIn / p.area); $("rPsfS").textContent = `list ${inr(p.listAllIn / p.area)}`;
  $("rAv").textContent = inr(R.av); $("rAvS").textContent = `stamp duty slab ${(R.rate * 100).toFixed(1)}%`;
  let cls = "status", msg;
  if (sol.capped) { cls += " note"; msg = `<i>i</i><span>The highest All-In for this plot is the list price, ${inr(p.listAllIn)}, with no offer.</span>`; }
  else if (!sol.exact) { cls += " note"; msg = `<i>i</i><span>${inr(S.target)} can't be hit exactly because stamp duty and registration round up to the nearest ₹100${Math.abs(S.target - R.allIn) > 1000 ? " and the stamp duty rate steps up at this value" : ""}. The closest possible All-In is <b>${inr(R.allIn)}</b>.</span>`; }
  else if (R.allIn < p.actualFloor - 0.5) { cls += " warn"; msg = `<i>!</i><span>Cost sheet balanced at ${inr(R.allIn)}. This is below the actual floor of ${inr(p.actualFloor)}.</span>`; }
  else if (R.allIn < p.minAllIn - 0.5) { cls += " note"; msg = `<i>i</i><span>Cost sheet balanced at ${inr(R.allIn)}. This is below the TL floor of ${inr(p.minAllIn)}.</span>`; }
  else { msg = `<i>✓</i><span>Cost sheet balanced. All-In is exactly ${inr(R.allIn)} with an offer of ${inr(off)}.</span>`; }
  st.className = cls; st.innerHTML = msg;
  renderPages();
}

// Excel number format "₹"#,##0_);[Red]("₹"#,##0)
const xl = n => { const v = Math.round(n); return v < 0 ? `<span class="red">(₹${Math.abs(v).toLocaleString("en-IN")})</span>` : `₹${v.toLocaleString("en-IN")}`; };
const pc = n => (n * 100).toFixed(2) + "%";
function schedRows(s, blank) {
  const n = s.length, last = n - 1, gstSpan = last + (blank ? 1 : 0);
  let h = `<tr><td colspan="2">${s[0].m}</td><td class="r" rowspan="2">${pc(0.099)}</td><td class="r">${xl(s[0].amt)}</td><td rowspan="${gstSpan}"></td><td class="r" rowspan="2">${xl(s[0].tds)}</td><td class="r">${xl(s[0].pay)}</td></tr>`;
  h += `<tr><td colspan="2">${s[1].m}</td><td class="r">${xl(s[1].amt)}</td><td class="r">${xl(s[1].pay)}</td></tr>`;
  if (blank) h += `<tr><td colspan="2"></td><td></td><td></td><td></td><td></td></tr>`;
  for (let i = 2; i < n; i++) { const r = s[i];
    h += `<tr><td colspan="2">${r.m}</td><td class="r">${pc(r.share)}</td><td class="r">${xl(r.amt)}</td>${i === last ? `<td class="r">${xl(r.gst)}</td>` : ""}<td class="r">${xl(r.tds)}</td><td class="r">${xl(r.pay)}</td></tr>`; }
  return h;
}

  <tr><td class="pk c" colspan="2">Consideration Value</td><td class="pk r">${xl(c.cv)}</td><td class="pk r">${xl(c.infraGst)}</td><td class="pk r" colspan="2">${xl(c.cv + c.infraGst)}</td></tr>
  <tr><td class="c b wrap" rowspan="3">Payable at registration</td><td class="c" colspan="2">Stamp Duty</td><td class="r">${xl(c.stamp)}</td><td rowspan="2"></td><td class="r" colspan="2">${xl(c.stamp)}</td></tr>

  <tr><td class="c ar" colspan="7">2. Corpus charges are levied at the rate of Rs. ${p.camRate} per sq.ft of land per month for a period of 1 year payable at possession and&nbsp; it is not recurring.</td></tr>

  <tr></tr><tr></tr>
  </table></div>`;
  $("pages").innerHTML = html;

function fit() { const w = $("pscale").clientWidth, k = Math.min(1, w / 794); const inner = $("pages"); inner.style.transform = `scale(${k})`; $("pscale").style.height = (inner.scrollHeight * k) + "px"; }
window.addEventListener("resize", fit);

// ---- download: only the price sheet ----
function toast(t) { $("toast").textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").textContent = "", 5000); }
let DL = null; window.claude?.use?.("downloads")?.then(d => { DL = d; });
$("dlPng").onclick = async e => {
  if (!R) return;
  const btn = e.target, label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:794px";
  holder.innerHTML = $("pages").innerHTML; document.body.appendChild(holder);
  try {
    const pg = holder.querySelector(".page"); pg.style.boxShadow = "none";
    const canvas = await html2canvas(pg, { scale: 2, backgroundColor: "#ffffff", logging: false });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const name = `${CONFIG.projects[R.p.project].name} ${R.p.plot} Price Sheet.png`;
    if (DL) { await DL.save({ filename: name, data: blob }); }
    else { const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
    toast("Saved " + name);
  } catch (err) { toast(err && err.code === "declined" ? "Download cancelled." : "Couldn't create the image. Try again."); }
  finally { holder.remove(); btn.disabled = false; btn.textContent = label; }
};

renderList();
pick($("list").querySelector("[data-id]").dataset.id);
